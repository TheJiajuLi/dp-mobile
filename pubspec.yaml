name: dreaming_polar
description: 极梦 — 数据科学内容社区
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # 网络
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # 本地存储
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI 组件
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0

  # Power Notebook
  flutter_inappwebview: ^6.0.0
  flutter_math_fork: ^0.7.2
  file_picker: ^8.0.0
  flutter_markdown: ^0.7.3

  # 工具
  intl: ^0.20.2
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.4.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/zodiac/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"